global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka-brokers
    static_configs:
      - targets:
          - "${KAFKA_1_PRIVATE_IP}:9404"
          - "${KAFKA_2_PRIVATE_IP}:9404"

  - job_name: zookeeper
    static_configs:
      - targets:
          - "${ZOOKEEPER_PRIVATE_IP}:9405"

  - job_name: ventas-app
    static_configs:
      - targets:
          - "${APP_PRIVATE_IP}:9406"
          - "${APP_PRIVATE_IP}:9407"

  - job_name: node-exporter
    static_configs:
      - targets: ["${KAFKA_1_PRIVATE_IP}:9100"]
        labels:
          node: kafka-zookeeper
          role: kafka
      - targets: ["${KAFKA_2_PRIVATE_IP}:9100"]
        labels:
          node: kafka-broker-2
          role: kafka
      - targets: ["${APP_PRIVATE_IP}:9100"]
        labels:
          node: app
          role: app
      - targets: ["${MONITORING_PRIVATE_IP}:9100"]
        labels:
          node: monitoring
          role: monitoring
